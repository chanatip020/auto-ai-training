[project]
name = "ai-auto-training-backend"
version = "0.1.0"
description = "AI Auto Training Platform — backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29.0",
  # psycopg2-binary is used by alembic only (we rewrite +asyncpg -> +psycopg2
  # in alembic/env.py because alembic prefers a sync driver for migrations).
  # The application itself always uses asyncpg.
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.0",
  "python-multipart>=0.0.12",
  "loguru>=0.7.2",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "pillow>=10.4.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
training = [
  "ultralytics>=8.3.0",
  # CPU-only torch wheels are smaller; pin if you need GPU/CUDA-specific build.
  "torch>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools]
packages = ["app"]