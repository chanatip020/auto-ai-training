# nginx config for the frontend container.
# - Serves the built SPA from /usr/share/nginx/html
# - Proxies /api (regular HTTP) AND /api/v1/sse (Server-Sent Events) to the
#   api container.  SSE needs buffering disabled and a long read timeout.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for the JS bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # ---- SPA routing ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API proxy (uploads can be large) ----
    location /api/ {
        # Special-case SSE so progress streams stay open.
        if ($uri ~* "^/api/v1/sse/") {
            set $is_sse 1;
        }

        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 1024m;    # large ZIP uploads
        proxy_request_buffering off;   # stream the upload through
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE-friendly settings (no-op for regular requests)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
