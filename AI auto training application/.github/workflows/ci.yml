name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Backend: ruff lint + pytest unit tests + alembic SQL generation
  # ------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    defaults:
      run:
        working-directory: ./backend
    env:
      # Pytest doesn't touch a real DB; conftest sets harmless defaults but
      # we override here to be explicit and avoid surprises on env changes.
      API_TOKEN: ci-test-token-please-change
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      STORAGE_BACKEND: local
      STORAGE_ROOT: /tmp/aiat-test-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Unit tests (pytest)
        run: pytest tests/unit -q --tb=short

      - name: Alembic SQL generation
        # Make sure no migration is broken even before we hit a real Postgres.
        run: alembic upgrade head --sql > /tmp/migrations.sql

  # ------------------------------------------------------------------
  # Frontend: tsc + vitest
  # ------------------------------------------------------------------
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund
          fi

      - name: Type-check (tsc)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

  # ------------------------------------------------------------------
  # Docker: just make sure both images BUILD; we don't run them in CI
  # since they need Supabase credentials. Catches Dockerfile breakage.
  # ------------------------------------------------------------------
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
